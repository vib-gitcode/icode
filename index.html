<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Nexus Page</title>
    </head>

    <body>
        <a class="emojibutton" href="code/pages/settings.html">⚙️</a>
        <!-- 1. Header Section -->
        <header class="dashboard-item" id="top-item">
            <h1>Web User Ultimate Dashboard 🌐</h1>
            <h3>
                by: Vibhav
            </h3>
            <p class="centeredtext">
                Welcome to my app, I am developing this at icode today,
                it's my PWA (progressive web app!) here are some widgets!👇
            </p>
        </header>
        <div class="container">


            <div class="dashboard-item" id="w1">

            </div>
            <div class="dashboard-item centeredtext" id="w2">
            
            </div>
            <div class="dashboard-item" id="w3">
                Task List <input type="text"placeholder="Task Name" id="tasktextbox">
                <button onclick="newtask()"> Add Task</button>
                <button onclick="delAllTasks()">Clear All Tasks</button>
                
                <ul id="tasks"></ul>
            </div>
            <div class="dashboard-item" id="w4">
                Shortcuts:
                <input type="text" placeholder="Hyperlink of Shortcut" id="linktextbox">
                <input type="text" placeholder="Name of Shortcut" id="nametextbox">
                <ul id="links"></ul>
                <button onclick="newshortcut()">Add shortcut</button>
            </div>
            <div class="dashboard-item" id="w5">
                <h2 class="centeredtext">daily videos!</h2>
                <iframe id="dailyvid1" src="" frameborder="0" allowfullscreen></iframe>


            </div>
            
        </div>
        <script src="./WeatherWidget.js"></script>
        <script src="Clockwidget.js"></script>
        <script src="tasklist.js"></script>
        <script src="shortcuts.js"></script>
        <script src="dailyvideos.js"></script>
    </body>

</html>
